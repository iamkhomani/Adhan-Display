# Nginx config for self-hosting Adhan Display (for example on a test server).
# GitHub Pages ignores this file.
#
# Note: nginx only inherits add_header from the server block when a location
# has no add_header of its own, so the security headers are repeated below.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Page and app code: always revalidate so updates appear right away.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    }

    location ~* \.(?:js|css|json)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Fonts, images and audio rarely change.
    location ~* \.(?:woff2|png|jpg|jpeg|webp|svg|ico|mp3)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ /\. {
        deny all;
    }
}
