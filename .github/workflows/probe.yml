name: Probe live streams
on:
  push:
    branches: [probe-live-streams]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Mosque pages
        continue-on-error: true
        shell: bash {0}
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          for URL in "https://mawaqit.net/en/al-kabir-amsterdam" "https://mawaqit.net/nl/w/blauwe-amsterdam" "https://mawaqit.net/en/essalam-rotterdam"; do
            echo "=================== $URL"
            curl -sS -L -D - -A "$UA" -H "Origin: https://adhandisplay.com" "$URL" -o p.html | grep -iE "^HTTP|^location|access-control|x-frame|content-security|cache-control"
            python3 - <<'PY'
          import re,json
          h=open('p.html',encoding='utf8',errors='replace').read()
          m=re.search(r'confData\s*=\s*(\{.*?\});\s*\n',h,re.S)
          print('bytes',len(h),'confData',bool(m))
          if m:
              d=json.loads(m.group(1)); print('KEYS',sorted(d.keys()))
              for k in ('name','uuid','slug','times','iqamaCalendar','calendar','jumua','jumua2','jumua3','shuruq','timezone','iqamaEnabled','latitude','longitude','hijriAdjustment','dst'):
                  v=d.get(k); s=json.dumps(v,ensure_ascii=False); print(' ',k,len(s), s[:300])
          PY
          done
          echo "== no-origin CORS check on page"
          curl -sSI -A "$UA" -H "Origin: https://adhandisplay.com" "https://mawaqit.net/en/al-kabir-amsterdam" | grep -iE "^HTTP|access-control"
