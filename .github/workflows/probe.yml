name: Probe live streams
on:
  push:
    branches: [probe-live-streams]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Find web search endpoint
        continue-on-error: true
        shell: bash {0}
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          curl -sS -L -c jar -A "$UA" "https://mawaqit.net/en/" -o h.html -w "home %{http_code} %{url_effective} %{size_download}\n"
          grep -oiE '(action|href|src|data-[a-z-]+)="[^"]*(search|mosque|api|\.js)[^"]*"' h.html | sort -u | head -40
          for JS in $(grep -oE 'src="[^"]+\.js[^"]*"' h.html | sed -E 's/src="//; s/"$//' | head -8); do
            case "$JS" in http*) U="$JS";; *) U="https://mawaqit.net$JS";; esac
            curl -sS -A "$UA" "$U" -o a.js; echo "-- $U $(wc -c < a.js)"; grep -oE '["'"'"'`][^"'"'"'`]*(search|api/)[^"'"'"'`]{0,80}' a.js | sort -u | head -15
          done
          echo "== try with session cookie"
          for U in "https://mawaqit.net/api/2.0/mosque/search?word=amsterdam" "https://mawaqit.net/en/m?search=amsterdam" "https://mawaqit.net/api/2.0/mosque/search?word=amsterdam&fields=slug,label"; do
            curl -sS -b jar -A "$UA" -H "X-Requested-With: XMLHttpRequest" -H "Referer: https://mawaqit.net/en/" -o r.out -w "$U -> %{http_code} %{content_type} %{size_download}\n" "$U"; head -c 400 r.out; echo
          done
