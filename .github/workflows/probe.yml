name: Probe live streams
on:
  push:
    branches: [probe-live-streams]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-prices.mjs && echo "JSONSTART" && cat data/zakat-prices.json
