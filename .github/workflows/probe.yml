name: Probe live streams
on:
  push:
    branches: [probe-live-streams]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Sitemap / robots
        continue-on-error: true
        shell: bash {0}
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          curl -sS -A "$UA" https://mawaqit.net/robots.txt | head -40
          for U in https://mawaqit.net/sitemap.xml https://mawaqit.net/sitemap_index.xml https://mawaqit.net/en/sitemap.xml https://mawaqit.net/sitemap/mosques.xml; do
            curl -sS -L -A "$UA" "$U" -o sm.xml -w "$U -> %{http_code} %{content_type} %{size_download}\n"; head -c 600 sm.xml; echo; grep -c "<loc>" sm.xml
          done
          echo "== terms"
          curl -sS -L -A "$UA" "https://mawaqit.net/en/cgu" -o t.html -w "cgu %{http_code}\n"; python3 -c "
          import re,html;t=re.sub(r'<[^>]+>',' ',open('t.html',encoding='utf8',errors='replace').read());t=re.sub(r'\s+',' ',html.unescape(t))
          for w in ['scrap','robot','extract','automat','API','reprodu','commercial']:
            for m in re.finditer(w,t,re.I): print(w,'::',t[max(0,m.start()-200):m.start()+250]); break"
