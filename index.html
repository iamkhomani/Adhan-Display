<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker
                .register('/sw.js')
                .then(registration => {
                    console.log(
                        '[Adhan Display] Service worker registered:',
                        registration.scope
                    );
                })
                .catch(error => {
                    console.warn(
                        '[Adhan Display] Service worker registration failed.',
                        error
                    );
                });
        });
    }
</script>
